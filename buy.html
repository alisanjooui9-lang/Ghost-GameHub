<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Hub - Checkout</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

@keyframes rgb{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

header{
    height:70px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#080808;
    border-bottom:1px solid #222;
}

.logo{
    font-family:Arial;
    font-size:21px;
    font-weight:bold;
}

.logo span{
    background:linear-gradient(
        90deg,red,#ff00ff,blue,cyan,lime,yellow,red
    );
    background-size:400%;
    animation:rgb 4s linear infinite;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.back{
    color:#aaa;
    text-decoration:none;
    font-size:10px;
}

.container{
    max-width:650px;
    margin:auto;
    padding:35px 15px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    margin:0;
    font-family:Arial;
    font-size:29px;
}

.title p{
    color:#666;
    font-size:9px;
}

.card{
    position:relative;
    background:#090909;
    border:1px solid #292929;
    border-radius:18px;
    padding:25px;
    overflow:hidden;
}

.card:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:3px;
    background:linear-gradient(
        90deg,red,#ff00ff,blue,cyan,lime,yellow,red
    );
    background-size:400%;
    animation:rgb 3s linear infinite;
}

.game{
    display:flex;
    gap:18px;
    align-items:center;
    padding-bottom:20px;
    border-bottom:1px solid #222;
}

.game img{
    width:100px;
    height:135px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid #333;
}

.game-info h2{
    font-family:Arial;
    font-size:18px;
    margin:0 0 10px;
}

.android{
    display:inline-block;
    color:#7cff7c;
    background:#0b180b;
    border:1px solid #315b31;
    border-radius:7px;
    padding:6px 9px;
    font-size:8px;
}

.price{
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
}

.form{
    padding-top:20px;
}

label{
    display:block;
    color:#aaa;
    font-size:10px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid #292929;
    background:#111;
    color:#fff;
    outline:none;
    direction:ltr;
}

input:focus{
    border-color:#00ffff;
}

.pay{
    width:100%;
    padding:15px;
    border:0;
    border-radius:11px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
    background:linear-gradient(
        90deg,red,#ff00ff,blue,cyan,lime,yellow
    );
    background-size:300%;
    animation:rgb 4s linear infinite;
}

.result{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#071207;
    border:1px solid #285528;
    color:#9cff9c;
    font-size:10px;
    line-height:2.2;
}

.order-code{
    direction:ltr;
    text-align:center;
    font-family:Arial;
    font-size:18px;
    color:#00ffff;
    margin:10px 0;
}

.notice{
    color:#555;
    font-size:8px;
    text-align:center;
    line-height:2;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 <span>GAME HUB</span></div>
    <a href="index.html" class="back">← STORE</a>
</header>

<div class="container">

<div class="title">
    <h1>CHECKOUT</h1>
    <p>ANDROID GAME STORE</p>
</div>

<div class="card">

<div class="game">

<img id="gameImage" src="" alt="Game">

<div class="game-info">
    <span class="android">ANDROID</span>

    <h2 id="gameName">GAME</h2>

    <div class="price" id="gamePrice">-</div>
</div>

</div>

<div class="form">

<label for="phone">
شماره موبایل
</label>

<input
    id="phone"
    type="tel"
    inputmode="numeric"
    maxlength="15"
    placeholder="09xxxxxxxxx"
>

<label for="name">
نام مشتری
</label>

<input
    id="name"
    type="text"
    maxlength="60"
    placeholder="نام و نام خانوادگی"
>

<button
    class="pay"
    onclick="createOrder()">

💳 ثبت سفارش

</button>

</div>

<div
id="result"
class="result">

✅ سفارش شما ثبت شد.

<div class="order-code" id="orderCode"></div>

نام بازی:
<strong id="resultGame"></strong>

<br>

شماره ثبت‌شده:
<strong id="resultPhone"></strong>

<br>

این کد را برای پیگیری سفارش خود نگه دارید.

</div>

<div class="notice">

این نسخه آزمایشی است و پرداخت واقعی در آن فعال نیست.
<br>
برای پرداخت واقعی باید درگاه پرداخت معتبر و مجاز متصل شود.

</div>

</div>
</div>

<script>

/* =========================
   GAME DATA
========================= */

const games = {

    gta5:{
        name:"GRAND THEFT AUTO V",
        size:"2000 MB",
        price:15000,
        image:"images/gta5.jpg"
    },

    rdr1:{
        name:"RED DEAD REDEMPTION",
        size:"7000 MB",
        price:10000,
        image:"images/rdr1.jpg"
    },

    sanandreas:{
        name:"GRAND THEFT AUTO: SAN ANDREAS",
        size:"2400 MB",
        price:10000,
        image:"images/sanandreas.jpg"
    },

    vicecity:{
        name:"GRAND THEFT AUTO: VICE CITY",
        size:"1500 MB",
        price:10000,
        image:"images/vicecity.jpg"
    },

    gta3:{
        name:"GRAND THEFT AUTO III",
        size:"800 MB",
        price:10000,
        image:"images/gta3.jpg"
    }

};


/* =========================
   READ GAME
========================= */

const params =
new URLSearchParams(location.search);

const gameID =
params.get("game") || "gta5";

const game =
games[gameID] || games.gta5;


/* =========================
   DISPLAY
========================= */

document.getElementById("gameName")
.textContent = game.name;

document.getElementById("gamePrice")
.textContent =
game.price.toLocaleString("fa-IR")
+ " تومان";

document.getElementById("gameImage")
.src = game.image;


/* =========================
   ORDER CODE
========================= */

function generateOrderCode(){

    const random =
    Math.floor(
        100000 +
        Math.random()*900000
    );

    return "GH-" + random;

}


/* =========================
   CREATE ORDER
========================= */

function createOrder(){

    const phone =
    document.getElementById("phone")
    .value.trim();

    const name =
    document.getElementById("name")
    .value.trim();


    if(!phone){

        alert("لطفاً شماره موبایل را وارد کنید.");

        return;
    }


    if(!/^09\d{9}$/.test(phone)){

        alert(
            "شماره موبایل باید مانند 09123456789 باشد."
        );

        return;
    }


    if(!name){

        alert("لطفاً نام خود را وارد کنید.");

        return;
    }


    const orderCode =
    generateOrderCode();


    const order = {

        code:orderCode,

        game:game.name,

        gameID:gameID,

        phone:phone,

        name:name,

        price:game.price,

        date:
        new Date().toLocaleString("fa-IR"),

        status:"در انتظار پرداخت"

    };


    /* GET OLD ORDERS */

    let orders =
    JSON.parse(
        localStorage.getItem("gameHubOrders")
    ) || [];


    /* ADD NEW ORDER */

    orders.push(order);


    /* SAVE */

    localStorage.setItem(
        "gameHubOrders",
        JSON.stringify(orders)
    );


    /* SHOW RESULT */

    document.getElementById(
        "orderCode"
    ).textContent =
    orderCode;


    document.getElementById(
        "resultGame"
    ).textContent =
    game.name;


    document.getElementById(
        "resultPhone"
    ).textContent =
    phone;


    document.getElementById(
        "result"
    ).style.display =
    "block";


    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior:"smooth"
    });

}

</script>

</body>
</html>
