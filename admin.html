<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ghost GameHub | Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

@keyframes rgb{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

header{
    min-height:70px;
    background:#080808;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
}

.logo{
    font-size:20px;
    font-weight:bold;
    font-family:Arial;
}

.logo span{
    background:linear-gradient(
        90deg,
        red,#ff00ff,blue,cyan,lime,yellow,red
    );
    background-size:400%;
    animation:rgb 4s linear infinite;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.header-btn{
    background:#111;
    border:1px solid #292929;
    color:#aaa;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:9px;
}

.header-btn:hover{
    color:#fff;
    border-color:#00ffff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 15px;
}

.login-box{
    max-width:420px;
    margin:50px auto;
    background:#090909;
    border:1px solid #292929;
    border-radius:18px;
    padding:25px;
    position:relative;
    overflow:hidden;
}

.login-box:before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:100%;
    height:3px;
    background:linear-gradient(
        90deg,
        red,#ff00ff,blue,cyan,lime,yellow,red
    );
    background-size:400%;
    animation:rgb 3s linear infinite;
}

.login-box h2{
    text-align:center;
    font-size:19px;
    margin:5px 0 25px;
}

label{
    display:block;
    color:#aaa;
    font-size:10px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:16px;
    background:#111;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
}

input:focus{
    border-color:#00ffff;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(
        90deg,
        red,#ff00ff,blue,cyan,lime,yellow
    );
    background-size:300%;
    animation:rgb 4s linear infinite;
}

.message{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:9px;
    line-height:2;
}

.error{
    background:#180707;
    border:1px solid #5b2222;
    color:#ff8585;
}

.admin-panel{
    display:none;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    margin:0;
    font-size:28px;
    font-family:Arial;
}

.title p{
    color:#666;
    font-size:9px;
}

.user-info{
    text-align:center;
    color:#666;
    font-size:8px;
    margin-bottom:20px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.stat{
    background:#090909;
    border:1px solid #292929;
    border-radius:12px;
    padding:16px;
    text-align:center;
}

.stat-number{
    display:block;
    font-size:22px;
    font-family:Arial;
    font-weight:bold;
    color:#00ffff;
    margin-bottom:6px;
}

.stat-title{
    color:#777;
    font-size:8px;
}

/* SEARCH */

.toolbar{
    margin-bottom:20px;
}

.search{
    margin:0;
}

/* ORDERS */

.orders{
    display:grid;
    gap:12px;
}

.order{
    background:#090909;
    border:1px solid #292929;
    border-radius:15px;
    padding:18px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.order-code{
    color:#00ffff;
    font-family:Arial;
    font-size:17px;
    font-weight:bold;
    direction:ltr;
}

.status{
    padding:7px 10px;
    border-radius:7px;
    background:#151515;
    border:1px solid #333;
    font-size:8px;
}

.status.waiting{
    color:#ffd34d;
    border-color:#66551d;
}

.status.paid{
    color:#65baff;
    border-color:#234d68;
}

.status.preparing{
    color:#c48cff;
    border-color:#542d76;
}

.status.completed{
    color:#75ff75;
    border-color:#286228;
}

.status.cancelled{
    color:#ff7070;
    border-color:#672626;
}

.order-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.item{
    background:#111;
    border-radius:9px;
    padding:10px;
}

.item small{
    display:block;
    color:#666;
    font-size:7px;
    margin-bottom:5px;
}

.item strong{
    font-size:10px;
    word-break:break-word;
}

.order-actions{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-top:15px;
}

.action{
    padding:10px 5px;
    border-radius:8px;
    border:1px solid #292929;
    background:#111;
    color:#aaa;
    cursor:pointer;
    font-size:8px;
}

.action:hover{
    color:#fff;
    border-color:#00ffff;
}

.delete{
    border-color:#3b1818;
}

.delete:hover{
    border-color:#ff4444;
    color:#ff7777;
}

.empty{
    text-align:center;
    color:#666;
    padding:40px;
    background:#090909;
    border:1px solid #222;
    border-radius:15px;
}

.loading{
    text-align:center;
    color:#888;
    padding:30px;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .order-info{
        grid-template-columns:1fr;
    }

    .order-actions{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
👻 <span>GHOST GAMEHUB</span>
</div>

<div class="header-buttons">

<button
class="header-btn"
onclick="loadOrders()">
🔄 بروزرسانی
</button>

<button
class="header-btn"
onclick="logout()">
🚪 خروج
</button>

</div>

</header>


<div class="container">


<!-- LOGIN -->

<div
id="loginBox"
class="login-box">

<h2>
🔐 ورود مدیر
</h2>

<form onsubmit="login(event)">

<label>
ایمیل مدیر
</label>

<input
id="email"
type="email"
required
placeholder="admin@example.com">

<label>
رمز عبور
</label>

<input
id="password"
type="password"
required
placeholder="رمز عبور">

<button
id="loginButton"
class="main-btn"
type="submit">

ورود به پنل

</button>

</form>

<div
id="loginError"
class="message error">
</div>

</div>


<!-- ADMIN -->

<div
id="adminPanel"
class="admin-panel">

<div class="title">

<h1>
مدیریت سفارش‌ها
</h1>

<p>
GHOST GAMEHUB • ADMIN PANEL
</p>

</div>

<div
id="userInfo"
class="user-info">
</div>


<!-- STATS -->

<div class="stats">

<div class="stat">
<span
id="totalCount"
class="stat-number">
0
</span>
<span class="stat-title">
کل سفارش‌ها
</span>
</div>

<div class="stat">
<span
id="waitingCount"
class="stat-number">
0
</span>
<span class="stat-title">
در انتظار پرداخت
</span>
</div>

<div class="stat">
<span
id="paidCount"
class="stat-number">
0
</span>
<span class="stat-title">
پرداخت شده
</span>
</div>

<div class="stat">
<span
id="completedCount"
class="stat-number">
0
</span>
<span class="stat-title">
تکمیل شده
</span>
</div>

</div>


<!-- SEARCH -->

<div class="toolbar">

<input
id="searchInput"
class="search"
type="search"
placeholder="جستجو با کد، نام، موبایل یا بازی..."
oninput="filterOrders()">

</div>


<div
id="orders"
class="orders">

<div class="loading">
در حال دریافت سفارش‌ها...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://lldjrltmwllogpsvfwyq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OSZVrAQ9pntRAAvuonFcMg_5X3RT0-o";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   DATA
========================= */

let allOrders = [];


/* =========================
   LOGIN
========================= */

async function login(event){

    event.preventDefault();

    const email =
    document.getElementById("email")
    .value.trim();

    const password =
    document.getElementById("password")
    .value;

    const button =
    document.getElementById("loginButton");

    const errorBox =
    document.getElementById("loginError");

    errorBox.style.display = "none";

    button.disabled = true;

    button.textContent =
    "در حال ورود...";

    const {data,error} =
    await supabaseClient.auth
    .signInWithPassword({

        email:email,
        password:password

    });

    if(error){

        errorBox.textContent =
        "خطای ورود: " +
        (error.message ||
        "اطلاعات ورود صحیح نیست.");

        errorBox.style.display =
        "block";

        button.disabled = false;

        button.textContent =
        "ورود به پنل";

        return;
    }

    showAdminPanel(
        data.user
    );

}


/* =========================
   SHOW ADMIN
========================= */

function showAdminPanel(user){

    document.getElementById(
        "loginBox"
    ).style.display = "none";

    document.getElementById(
        "adminPanel"
    ).style.display = "block";

    document.getElementById(
        "userInfo"
    ).textContent =
    "وارد شده با: " +
    user.email;

    loadOrders();

}


/* =========================
   SESSION
========================= */

async function checkSession(){

    const {data} =
    await supabaseClient.auth
    .getSession();

    if(data.session){

        showAdminPanel(
            data.session.user
        );

    }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    const box =
    document.getElementById("orders");

    box.innerHTML =
    '<div class="loading">در حال دریافت سفارش‌ها...</div>';

    const {data,error} =
    await supabaseClient
    .from("orders")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );

    if(error){

        box.innerHTML =
        '<div class="message error" style="display:block">' +
        "خطای دریافت سفارش‌ها: " +
        escapeHTML(error.message) +
        "</div>";

        return;
    }

    allOrders = data || [];

    updateStats();

    renderOrders(allOrders);

}


/* =========================
   STATS
========================= */

function updateStats(){

    document.getElementById(
        "totalCount"
    ).textContent =
    allOrders.length;


    let waiting = 0;
    let paid = 0;
    let completed = 0;


    allOrders.forEach(order => {

        if(order.status === "در انتظار پرداخت"){
            waiting++;
        }

        if(order.status === "پرداخت شده"){
            paid++;
        }

        if(order.status === "تکمیل شده"){
            completed++;
        }

    });


    document.getElementById(
        "waitingCount"
    ).textContent =
    waiting;


    document.getElementById(
        "paidCount"
    ).textContent =
    paid;


    document.getElementById(
        "completedCount"
    ).textContent =
    completed;

}


/* =========================
   STATUS CLASS
========================= */

function getStatusClass(status){

    if(status === "در انتظار پرداخت")
        return "waiting";

    if(status === "پرداخت شده")
        return "paid";

    if(status === "در حال آماده‌سازی")
        return "preparing";

    if(status === "تکمیل شده")
        return "completed";

    if(status === "لغو شده")
        return "cancelled";

    return "";

}


/* =========================
   RENDER
========================= */

function renderOrders(orders){

    const box =
    document.getElementById("orders");


    if(!orders.length){

        box.innerHTML =
        '<div class="empty">' +
        "📦 سفارشی پیدا نشد." +
        "</div>";

        return;

    }


    box.innerHTML =
    orders.map(order => {

        const date =
        order.created_at
        ?
        new Date(
            order.created_at
        ).toLocaleString("fa-IR")
        :
        "-";


        const statusClass =
        getStatusClass(
            order.status
        );


        return `

<div class="order">

<div class="order-top">

<div class="order-code">
${escapeHTML(
    order.order_code || "-"
)}
</div>

<div class="status ${statusClass}">
${escapeHTML(
    order.status || "-"
)}
</div>

</div>


<div class="order-info">

<div class="item">
<small>مشتری</small>
<strong>
${escapeHTML(
    order.customer_name || "-"
)}
</strong>
</div>

<div class="item">
<small>شماره موبایل</small>
<strong dir="ltr">
${escapeHTML(
    order.phone || "-"
)}
</strong>
</div>

<div class="item">
<small>بازی</small>
<strong>
${escapeHTML(
    order.game_name || "-"
)}
</strong>
</div>

<div class="item">
<small>قیمت</small>
<strong>
${formatPrice(order.price)}
</strong>
</div>

<div class="item">
<small>تاریخ</small>
<strong>
${escapeHTML(date)}
</strong>
</div>

<div class="item">
<small>شناسه بازی</small>
<strong>
${escapeHTML(
    order.game_id || "-"
)}
</strong>
</div>

</div>


<div class="order-actions">

<button
class="action"
onclick="setStatus(
'${escapeJS(order.id)}',
'در انتظار پرداخت'
)">
🟡 انتظار
</button>

<button
class="action"
onclick="setStatus(
'${escapeJS(order.id)}',
'پرداخت شده'
)">
🔵 پرداخت
</button>

<button
class="action"
onclick="setStatus(
'${escapeJS(order.id)}',
'در حال آماده‌سازی'
)">
🟣 آماده‌سازی
</button>

<button
class="action"
onclick="setStatus(
'${escapeJS(order.id)}',
'تکمیل شده'
)">
🟢 تکمیل
</button>

<button
class="action delete"
onclick="setStatus(
'${escapeJS(order.id)}',
'لغو شده'
)">
🔴 لغو
</button>

</div>


<div class="order-actions">

<button
class="action delete"
onclick="deleteOrder(
'${escapeJS(order.id)}'
)">
🗑️ حذف سفارش
</button>

</div>

</div>

`;

    }).join("");

}


/* =========================
   SET STATUS
========================= */

async function setStatus(
    id,
    status
){

    const {error} =
    await supabaseClient
    .from("orders")
    .update({
        status:status
    })
    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "خطا در تغییر وضعیت:\n" +
            error.message
        );

        return;
    }


    await loadOrders();

}


/* =========================
   DELETE
========================= */

async function deleteOrder(id){

    if(
        !confirm(
            "آیا از حذف این سفارش مطمئن هستید؟"
        )
    ){

        return;
    }


    const {error} =
    await supabaseClient
    .from("orders")
    .delete()
    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "خطا در حذف سفارش:\n" +
            error.message
        );

        return;
    }


    await loadOrders();

}


/* =========================
   SEARCH
========================= */

function filterOrders(){

    const query =
    document.getElementById(
        "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


    if(!query){

        renderOrders(
            allOrders
        );

        return;
    }


    const filtered =
    allOrders.filter(order => {

        const text = [

            order.order_code,
            order.customer_name,
            order.phone,
            order.game_name,
            order.game_id,
            order.status

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(
            query
        );

    });


    renderOrders(
        filtered
    );

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =========================
   HELPERS
========================= */

function formatPrice(price){

    if(
        price === null ||
        price === undefined
    ){

        return "-";

    }

    return Number(price)
    .toLocaleString("fa-IR")
    + " تومان";

}


function escapeHTML(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeJS(value){

    return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
